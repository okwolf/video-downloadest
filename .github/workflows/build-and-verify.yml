name: Build and verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for file in *.js test/*.js; do
            node --check "$file"
          done

      - name: Run tests
        run: npm test

      # The extension and server run from source, so no compilation is needed.
      - name: Build package
        run: npm pack --pack-destination "$RUNNER_TEMP"
