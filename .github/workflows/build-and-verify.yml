name: Build and verify

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm pack --pack-destination "$RUNNER_TEMP"

  build-macos-companion:
    name: Build macOS companion DMG
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build companion DMG
        env:
          APP_VERSION: ${{ github.event.release.tag_name || '0.1.0' }}
        run: |
          APP_VERSION="${APP_VERSION#v}" scripts/package-companion-macos.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-downloadest-macos-dmg
          path: dist/Video Downloadest-*.dmg
          if-no-files-found: error
          retention-days: 30

  attach-dmg-to-release:
    name: Attach macOS DMG to release
    if: github.event_name == 'release'
    needs: build-macos-companion
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: video-downloadest-macos-dmg
          path: release-assets

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.dmg --clobber
